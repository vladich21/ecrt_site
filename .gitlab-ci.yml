stages:
  - lint
  - build

variables:
  HARBOR_REGISTRY: harbor.sw.loc
  IMAGE: harbor.sw.loc/site/company-site

default:
  tags: []

lint:
  stage: lint
  image: node:20-alpine
  before_script:
    - npm ci
  script:
    - npm run lint
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

build:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  rules:
    # Push в Harbor только на protected semver-тегах (v*).
    # Push в main/ветки не нужен: prod деплоится только по тегу.
    # Protected HARBOR_* variables доступны только на protected refs.
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
      variables:
        IMAGE_TAG: "${CI_COMMIT_TAG}"
  script:
    - test -n "${HARBOR_USER}" && test -n "${HARBOR_PASSWORD}"
    - mkdir -p /kaniko/.docker
    - |
      json_escape() { printf '%s' "$1" | sed 's/\\/\\\\/g; s/"/\\"/g'; }
      USER="$(json_escape "${HARBOR_USER}")"
      PASS="$(json_escape "${HARBOR_PASSWORD}")"
      REG="${HARBOR_REGISTRY}"
      cat > /kaniko/.docker/config.json <<EOF
      {
        "auths": {
          "${REG}": {
            "username": "${USER}",
            "password": "${PASS}"
          },
          "https://${REG}": {
            "username": "${USER}",
            "password": "${PASS}"
          }
        }
      }
      EOF
    - test -s /kaniko/.docker/config.json
    - |
      /kaniko/executor \
        --context "${CI_PROJECT_DIR}" \
        --dockerfile "${CI_PROJECT_DIR}/Dockerfile" \
        --destination "${IMAGE}:${IMAGE_TAG}" \
        --insecure \
        --skip-tls-verify-registry "${HARBOR_REGISTRY}"
