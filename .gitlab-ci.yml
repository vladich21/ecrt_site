stages:
  - lint
  - build

variables:
  HARBOR_REGISTRY: harbor.sw.loc
  IMAGE: harbor.sw.loc/site/company-site

# GitLab Runner в k8s (namespace gitlab-runner) подхватывает untagged jobs.
default:
  tags: []

lint:
  stage: lint
  image: node:20-alpine
  before_script:
    - npm ci
  script:
    - npm run lint
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

build:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  rules:
    # Semver-теги вроде v1.2.3 — для prod-релизов и image-updater (strategy: semver).
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
      variables:
        IMAGE_TAG: "${CI_COMMIT_TAG}"
    # main — immutable sha-теги (fallback, если релиз без git tag).
    - if: $CI_COMMIT_BRANCH == "main"
      variables:
        IMAGE_TAG: "sha-${CI_COMMIT_SHORT_SHA}"
    # feature/ci-cd и прочие ветки — dev-сборки для проверки пайплайна.
    - if: $CI_COMMIT_BRANCH
      variables:
        IMAGE_TAG: "dev-${CI_COMMIT_SHORT_SHA}"
  script:
    - test -n "${HARBOR_USER}" && test -n "${HARBOR_PASSWORD}"
    - mkdir -p /kaniko/.docker
    - |
      AUTH="$(printf '%s:%s' "${HARBOR_USER}" "${HARBOR_PASSWORD}" | base64 | tr -d '\n')"
      printf '{"auths":{"%s":{"auth":"%s"}}}' "${HARBOR_REGISTRY}" "${AUTH}" > /kaniko/.docker/config.json
    - |
      /kaniko/executor \
        --context "${CI_PROJECT_DIR}" \
        --dockerfile "${CI_PROJECT_DIR}/Dockerfile" \
        --destination "${IMAGE}:${IMAGE_TAG}" \
        --insecure \
        --skip-tls-verify-registry "${HARBOR_REGISTRY}"
